# Example nginx config for installing Aqarat in a sub-folder: example.com/aqarat/
# (files in /var/www/example.com/public_html/aqarat). For a root install replace /aqarat with /.
server {
    listen 443 ssl http2;
    server_name example.com;
    root /var/www/example.com/public_html;
    client_max_body_size 64m;                     # several photos per request

    location /aqarat/ {
        # Never expose internals
        location ~ ^/aqarat/(app|data|bin|tests|deploy|node_modules)(/|$) { deny all; return 404; }
        location ~ /\.                           { deny all; return 404; }
        location ~* \.(md|sqlite|sqlite-wal|sqlite-shm|ini|log|sh)$ { deny all; return 404; }

        # Uploaded images: static only, never executed
        location ^~ /aqarat/uploads/ {
            location ~* \.php$ { deny all; }
            add_header X-Content-Type-Options nosniff always;
            add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; sandbox" always;
            expires 1y;
            try_files $uri =404;
        }

        location = /aqarat/sw.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
        location ~* ^/aqarat/assets/.*\.(css|js|svg|png|webp|woff2)$ { expires 30d; try_files $uri =404; }

        try_files $uri /aqarat/index.php$is_args$args;
    }

    location = /aqarat/index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/aqarat/index.php;
        fastcgi_param SCRIPT_NAME /aqarat/index.php;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
    location ~ ^/aqarat/.+\.php$ { return 404; }
}
