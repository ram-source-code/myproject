# Example nginx server block. Document root MUST be the /public directory.
server {
    listen 80;
    server_name aqarat.example.com;
    root /var/www/aqarat/public;
    index index.php;
    client_max_body_size 64m;   # several photos per request

    location / {
        try_files $uri /index.php$is_args$args;
    }

    # Uploaded images: static only, never executed
    location ^~ /uploads/ {
        location ~* \.(php|phtml|phar)$ { deny all; }
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; sandbox" always;
        expires 1y;
        try_files $uri =404;
    }

    location ~* \.(css|js|svg|woff2)$ { expires 30d; try_files $uri =404; }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location ~ \.php$ { return 404; }
    location ~ /\. { deny all; }
}
