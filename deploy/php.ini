; Recommended PHP settings for Aqarat
file_uploads = On
upload_max_filesize = 64M      ; videos up to 60 MB (photos are limited to 8 MB by the app)
post_max_size = 160M           ; several photos + 2 videos in one save
max_file_uploads = 20
memory_limit = 256M          ; GD decodes images fully into memory
max_execution_time = 120     ; large uploads on slow connections
expose_php = Off
display_errors = Off
log_errors = On
session.cookie_httponly = 1
session.use_strict_mode = 1
session.cookie_samesite = Lax
