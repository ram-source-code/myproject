; Recommended PHP settings for Aqarat
file_uploads = On
upload_max_filesize = 8M
post_max_size = 64M
max_file_uploads = 20
memory_limit = 256M          ; GD decodes images fully into memory
expose_php = Off
display_errors = Off
log_errors = On
session.cookie_httponly = 1
session.use_strict_mode = 1
session.cookie_samesite = Lax
